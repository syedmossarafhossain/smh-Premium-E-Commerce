<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users - Luxora Admin</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="logo">
                LUXORA
                <small>ADMIN PANEL</small>
            </div>

            <nav>

                <a href="index.html">
                    📊 Dashboard
                </a>

                <a href="products.html">
                    🛍 Products
                </a>

                <a href="categories.html">
                    🗂 Categories
                </a>

                <a href="users.html"  class="active">
                    👥 Users
                </a>

                <a href="orders.html">
                    📦 Orders
                </a>

                <a href="payments.html">
                    💳 Payments
                </a>

                <a href="coupons.html">
                    🎟 Coupons
                </a>

                <a href="reports.html">
                    📈 Reports
                </a>

            </nav>


            <!-- LOGOUT -->

            <div class="sidebar-bottom">

                <button class="logout-btn" onclick="adminLogout()">

                    <span>↪</span>

                    <span>Logout</span>

                </button>

            </div>

        </aside>


        <main class="main">

            <header class="topbar">

                <div>

                    <h1>Users</h1>

                    <p>
                        Manage registered customers
                    </p>

                </div>

            </header>


            <section class="panel">

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="userTable"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- USER DETAILS MODAL -->

    <div id="userModal" class="modal">

        <div class="modal-content">

            <h2>User Details</h2>

            <div id="userDetails"></div>

            <br>

            <button class="cancel-btn" onclick="closeUserModal()">

                Close

            </button>

        </div>

    </div>


    <script src="js/database.js"></script>
    <script src="js/users.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
