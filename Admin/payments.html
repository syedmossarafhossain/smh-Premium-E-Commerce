<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payments - Luxora Admin</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="logo">
                LUXORA
                <small>ADMIN PANEL</small>
            </div>

            <nav>

                <a href="index.html">
                    📊 Dashboard
                </a>

                <a href="products.html">
                    🛍 Products
                </a>

                <a href="categories.html">
                    🗂 Categories
                </a>

                <a href="users.html">
                    👥 Users
                </a>

                <a href="orders.html">
                    📦 Orders
                </a>

                <a href="payments.html"  class="active">
                    💳 Payments
                </a>

                <a href="coupons.html">
                    🎟 Coupons
                </a>

                <a href="reports.html">
                    📈 Reports
                </a>

            </nav>


            <!-- LOGOUT -->

            <div class="sidebar-bottom">

                <button class="logout-btn" onclick="adminLogout()">

                    <span>↪</span>

                    <span>Logout</span>

                </button>

            </div>

        </aside>


        <main class="main">

            <header class="topbar">

                <div>

                    <h1>Payments</h1>

                    <p>
                        Monitor customer payments
                    </p>

                </div>

            </header>


            <!-- PAYMENT STATISTICS -->

            <section class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ✓
                    </span>

                    <div>

                        <p>Successful</p>

                        <h2 id="successPayments">
                            0
                        </h2>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        ⏳
                    </span>

                    <div>

                        <p>Pending</p>

                        <h2 id="pendingPayments">
                            0
                        </h2>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        ✕
                    </span>

                    <div>

                        <p>Failed</p>

                        <h2 id="failedPayments">
                            0
                        </h2>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        ↩
                    </span>

                    <div>

                        <p>Refunded</p>

                        <h2 id="refundedPayments">
                            0
                        </h2>

                    </div>

                </div>

            </section>


            <section class="panel">

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>Payment ID</th>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="paymentTable"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="js/database.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
