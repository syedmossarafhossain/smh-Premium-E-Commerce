<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxora Admin Dashboard</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">
                LUXORA
                <small>ADMIN PANEL</small>
            </div>

            <nav>

                <a href="index.html" class="active">
                    📊 Dashboard
                </a>

                <a href="products.html">
                    🛍 Products
                </a>

                <a href="categories.html">
                    🗂 Categories
                </a>

                <a href="users.html">
                    👥 Users
                </a>

                <a href="orders.html">
                    📦 Orders
                </a>

                <a href="payments.html">
                    💳 Payments
                </a>

                <a href="coupons.html">
                    🎟 Coupons
                </a>

                <a href="reports.html">
                    📈 Reports
                </a>

            </nav>


            <!-- LOGOUT -->

            <div class="sidebar-bottom">

                <button class="logout-btn" onclick="adminLogout()">

                    <span>↪</span>

                    <span>Logout</span>

                </button>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">

            <header class="topbar">

                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome back, Administrator</p>
                </div>

                <div class="admin-user">
                    👤 Admin
                </div>

            </header>


            <!-- STATISTICS -->

            <section class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ₹
                    </span>

                    <div>
                        <p>Total Revenue</p>
                        <h2 id="totalRevenue">
                            ₹0
                        </h2>
                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        📦
                    </span>

                    <div>
                        <p>Total Orders</p>
                        <h2 id="totalOrders">
                            0
                        </h2>
                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        👥
                    </span>

                    <div>
                        <p>Total Users</p>
                        <h2 id="totalUsers">
                            0
                        </h2>
                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🛍
                    </span>

                    <div>
                        <p>Total Products</p>
                        <h2 id="totalProducts">
                            0
                        </h2>
                    </div>

                </div>

            </section>


            <!-- DASHBOARD CONTENT -->

            <section class="dashboard-grid">

                <div class="panel">

                    <div class="panel-title">
                        <h2>Recent Orders</h2>

                        <a href="orders.html">
                            View All →
                        </a>
                    </div>

                    <div id="recentOrders"></div>

                </div>


                <div class="panel">

                    <div class="panel-title">

                        <h2>Order Status</h2>

                    </div>

                    <div id="orderStatus"></div>

                </div>

            </section>


            <!-- TOP PRODUCTS -->

            <section class="panel">

                <div class="panel-title">

                    <h2>Top Products</h2>

                </div>

                <div id="topProducts"></div>

            </section>

        </main>

    </div>


    <script src="js/database.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
