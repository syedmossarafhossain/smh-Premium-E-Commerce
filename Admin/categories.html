<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories - Luxora Admin</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">
                LUXORA
                <small>ADMIN PANEL</small>
            </div>

            <nav>

                <a href="index.html">
                    📊 Dashboard
                </a>

                <a href="products.html">
                    🛍 Products
                </a>

                <a href="categories.html"  class="active">
                    🗂 Categories
                </a>

                <a href="users.html">
                    👥 Users
                </a>

                <a href="orders.html">
                    📦 Orders
                </a>

                <a href="payments.html">
                    💳 Payments
                </a>

                <a href="coupons.html">
                    🎟 Coupons
                </a>

                <a href="reports.html">
                    📈 Reports
                </a>

            </nav>


            <!-- LOGOUT -->

            <div class="sidebar-bottom">

                <button class="logout-btn" onclick="adminLogout()">

                    <span>↪</span>

                    <span>Logout</span>

                </button>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">

            <header class="topbar">

                <div>
                    <h1>Categories</h1>
                    <p>Manage product categories</p>
                </div>

                <button class="primary-btn" onclick="openCategoryForm()">

                    + Add Category

                </button>

            </header>


            <!-- CATEGORY FORM -->

            <div id="categoryModal" class="modal">

                <div class="modal-content">

                    <h2 id="categoryFormTitle">
                        Add Category
                    </h2>

                    <input type="hidden" id="categoryId">

                    <input type="text" id="categoryName" placeholder="Category Name">

                    <div class="form-buttons">

                        <button class="primary-btn" onclick="saveCategory()">

                            Save

                        </button>

                        <button class="cancel-btn" onclick="closeCategoryForm()">

                            Cancel

                        </button>

                    </div>

                </div>

            </div>


            <!-- CATEGORY TABLE -->

            <section class="panel">

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Category</th>
                                <th>Products</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="categoryTable"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="js/database.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
